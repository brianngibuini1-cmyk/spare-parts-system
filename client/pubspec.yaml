name: bmm_auto_motors
description: BMM Auto Motors cross-platform shop application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: BMM Auto Motors
  msix_version: 0.1.0.0
  logo_path: assets/branding/BMM-App-Icon-1024.png
  capabilities: internetClient
  architecture: x64
  store: false
  output_path: build/msix
  output_name: BMM-Auto-Motors
