name: Python and PostgreSQL verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spare_parts_test
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: spare_parts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spare_parts_test -d spare_parts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPARE_PARTS_ENVIRONMENT: test
      SPARE_PARTS_DATABASE_URL: postgresql+psycopg://spare_parts_test:ci_only_test_password@localhost:5432/spare_parts_test
      SPARE_PARTS_TEST_DATABASE_URL: postgresql+psycopg://spare_parts_test:ci_only_test_password@localhost:5432/spare_parts_test
      SPARE_PARTS_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://spare_parts_test:ci_only_test_password@localhost:5432/spare_parts_migration_test
      SPARE_PARTS_SCHEMA_TEST_DATABASE_URL: postgresql+psycopg://spare_parts_test:ci_only_test_password@localhost:5432/spare_parts_schema_test
      SPARE_PARTS_DOWNGRADE_TEST_DATABASE_URL: postgresql+psycopg://spare_parts_test:ci_only_test_password@localhost:5432/spare_parts_downgrade_test
      SPARE_PARTS_REQUIRE_POSTGRES_TESTS: "true"
      SPARE_PARTS_COOKIE_SECURE: "true"
      SPARE_PARTS_NATIVE_HTTPS_REQUIRED: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install declared project and test dependencies
        run: python -m pip install -r requirements.txt

      - name: Create isolated migration and schema databases
        env:
          PGPASSWORD: ci_only_test_password
        run: |
          createdb --host=localhost --username=spare_parts_test spare_parts_migration_test
          createdb --host=localhost --username=spare_parts_test spare_parts_schema_test
          createdb --host=localhost --username=spare_parts_test spare_parts_downgrade_test

      - name: Apply the complete migration chain to a fresh PostgreSQL database
        env:
          SPARE_PARTS_DATABASE_URL: postgresql+psycopg://spare_parts_test:ci_only_test_password@localhost:5432/spare_parts_schema_test
        run: |
          python -m alembic upgrade head || {
            echo "::error::Fresh PostgreSQL Alembic migration to head failed."
            exit 1
          }

      - name: Run complete test suite against PostgreSQL
        run: python -m pytest -q --tb=short
