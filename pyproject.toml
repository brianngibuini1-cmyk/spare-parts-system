[project]
name = "spare-parts-system"
version = "0.1.0"
description = "BMM Auto Motors cross-platform application with a FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.15.2",
    "boto3==1.44.3",
    "fastapi==0.115.12",
    "jinja2==3.1.6",
    "psycopg[binary]==3.2.6",
    "pillow==13.0.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.33",
    "pwdlib[argon2]==0.2.1",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["client*", "migrations*", "tests*"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
